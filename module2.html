<script>
try{var TK=JSON.parse(localStorage.getItem("brdc_v1_tasks")||"{}");if(!(TK.channel&&TK.group))location.replace("index.html#accueil")}catch(e){}
function pp(x,y){return '<circle class="y" cx="'+x+'" cy="'+y+'" r="9"/><path class="b" d="M'+(x-14)+' '+(y+32)+'a14 14 0 0 1 28 0z"/>'}
function nb(x,y,w,h){return '<rect class="a" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"/><path class="l" style="stroke-width:2" d="M'+(x+6)+' '+(y+h*.3)+'h'+(w-12)+'M'+(x+6)+' '+(y+h*.65)+'h'+(w-12)+'"/>'}
function sv(l,i){return '<svg viewBox="0 0 320 160" role="img" aria-label="'+l+'">'+i+'</svg>'}
function bk(x,L,cls,st){var t=L.map(function(s,i){return '<text class="bt" x="'+(x+44)+'" y="'+(52+i*16)+'" text-anchor="middle">'+s+'</text>'}).join("");return '<g class="'+(cls||'')+'" style="'+(st||'')+'"><rect class="bk '+(cls=='x'?'':'')+'" x="'+x+'" y="30" width="88" height="62" rx="6"/>'+t+'</g>'}
function lk(x){return '<path class="l" d="M'+x+' 61h18m-6 -5l6 5l-6 5"/>'}
var A=[["Infos","Empreinte A"],["Infos","Réf. : A","Empreinte B"],["Infos","Réf. : B"]];
var SVG={
tontine:sv("Des membres d’une tontine autour d’un carnet, l’un affirme avoir payé",'<g class="f1"><rect class="a" x="8" y="2" width="136" height="22" rx="8"/><text class="s" x="76" y="17" text-anchor="middle">J’ai déjà cotisé !</text></g>'+pp(60,44)+pp(160,44)+pp(260,44)+'<g class="f2"><text class="t" x="296" y="48" style="font-size:24px">?</text></g>'+nb(125,98,70,40)+'<g class="f3"><text class="s" x="160" y="154" text-anchor="middle">Qui a raison ?</text></g>'),
gardien:sv("Un seul gardien tient le carnet, les autres lui font confiance",pp(150,24)+nb(184,36,50,36)+pp(50,96)+pp(125,96)+pp(200,96)+pp(272,96)+'<path class="l f1" style="stroke-width:2" d="M58 92L140 62"/><path class="l f2" style="stroke-width:2" d="M128 92L150 66"/><path class="l f3" style="stroke-width:2" d="M198 92L160 66"/><path class="l f4" style="stroke-width:2" d="M268 92L170 64"/><g class="f5"><text class="t" x="160" y="154" text-anchor="middle">Un seul carnet, un seul gardien</text></g>'),
copies:sv("Chaque membre garde sa propre copie du carnet",pp(50,24)+pp(125,24)+pp(200,24)+pp(275,24)+nb(32,76,36,28)+nb(107,76,36,28)+nb(182,76,36,28)+nb(257,76,36,28)+'<path class="l" style="stroke-dasharray:4 5;stroke-width:2" d="M72 90h30M147 90h30M222 90h30"/><circle class="y f1" cx="62" cy="80" r="5"/><circle class="y f2" cx="137" cy="80" r="5"/><circle class="y f3" cx="212" cy="80" r="5"/><circle class="y f4" cx="287" cy="80" r="5"/><text class="t" x="160" y="140" text-anchor="middle">Chacun garde une copie</text>'),
chaine:sv("Trois blocs reliés : chaque bloc contient une référence au précédent",bk(10,A[0],'f1','')+lk(98)+bk(116,A[1],'f2','')+lk(204)+bk(222,A[2],'f3','')+'<text class="t" x="160" y="132" text-anchor="middle">Chaque bloc dépend du précédent</text>'),
triche:sv("Quand un ancien bloc est modifié, les liens avec les blocs suivants ne correspondent plus",bk(10,A[0],'out')+bk(10,["Infos modifiées","Empreinte A’"],'in tint1')+lk(98)+'<text class="rx" x="107" y="54" text-anchor="middle">✕</text>'+bk(116,A[1],'tint2')+lk(204)+bk(222,A[2],'tint3')+'<text class="t" x="160" y="132" text-anchor="middle">Le lien est rompu</text>'),
arbre:sv("Un arbre : la blockchain est le tronc, ses usages sont les branches : cryptomonnaies, paiements, certificats, traçabilité, DAO",'<path class="l" d="M160 100L60 18M160 100L160 18M160 100L260 18M160 100L110 62M160 100L210 62"/><rect class="b" x="95" y="100" width="130" height="34" rx="8"/><text x="160" y="122" text-anchor="middle" style="fill:#fff;font-weight:800;font-size:15px">Blockchain</text><g class="f1"><ellipse class="y" cx="60" cy="18" rx="46" ry="15"/><text class="bt" x="60" y="22" text-anchor="middle" style="font-size:10px">Cryptomonnaies</text></g><g class="f2"><ellipse class="bk" cx="160" cy="18" rx="46" ry="15"/><text class="bt" x="160" y="22" text-anchor="middle" style="font-size:10px">Paiements</text></g><g class="f3"><ellipse class="y" cx="260" cy="18" rx="46" ry="15"/><text class="bt" x="260" y="22" text-anchor="middle" style="font-size:10px">Certificats</text></g><g class="f4"><ellipse class="bk" cx="110" cy="62" rx="46" ry="15"/><text class="bt" x="110" y="66" text-anchor="middle" style="font-size:10px">Traçabilité</text></g><g class="f5"><ellipse class="y" cx="210" cy="62" rx="46" ry="15"/><text class="bt" x="210" y="66" text-anchor="middle" style="font-size:10px">DAO</text></g><text class="s" x="160" y="153" text-anchor="middle">Chaque branche est un usage possible</text>'),
cercles:sv("Deux cercles : la blockchain, une technologie, et le Web3, une vision d’Internet",'<g class="f1"><circle cx="118" cy="72" r="55" style="fill:#F5D13D;fill-opacity:.45;stroke:var(--ink);stroke-width:3"/><text class="t" x="88" y="70" text-anchor="middle" style="font-size:14px">Blockchain</text><text class="s" x="88" y="85" text-anchor="middle">une technologie</text></g><g class="f2"><circle cx="202" cy="72" r="55" style="fill:#1F4590;fill-opacity:.4;stroke:var(--ink);stroke-width:3"/><text class="t" x="236" y="70" text-anchor="middle" style="font-size:14px">Web3</text><text class="s" x="236" y="85" text-anchor="middle">une vision d’Internet</text></g><g class="f3"><circle class="y" cx="160" cy="72" r="5"/><path class="l" style="stroke-width:2" d="M160 80V138"/><text class="s" x="160" y="153" text-anchor="middle">Zone commune : applications décentralisées</text></g>'),
fil:sv("Le fil rouge : un registre, partagé, en chaîne",'<g class="f1"><rect class="y" x="8" y="48" width="86" height="46" rx="10"/><text class="bt" x="51" y="76" text-anchor="middle">Un registre</text></g><path class="l f2" d="M96 71h18m-6 -5l6 5l-6 5"/><g class="f3"><rect class="bk" x="116" y="48" width="86" height="46" rx="10"/><text class="bt" x="159" y="76" text-anchor="middle">partagé</text></g><path class="l f4" d="M204 71h18m-6 -5l6 5l-6 5"/><g class="f5"><rect class="b" x="224" y="48" width="86" height="46" rx="10"/><text x="267" y="76" text-anchor="middle" style="fill:#fff;font-weight:600;font-size:12px">en chaîne</text></g><text class="t" x="160" y="132" text-anchor="middle">La blockchain en trois idées</text>')
};
var screens=[
{stage:0,t:"Ce que tu vas apprendre dans ce module",b:[["svg","intro2"],["p","Dans le Module 1, tu as vu que le Web3 cherche à donner plus de contrôle aux utilisateurs. Ici, tu découvres la technologie qui le rend possible : la blockchain."],["p","Tu vas voir, dans l’ordre :"],["ol",["À quoi sert un registre.","Pourquoi une blockchain est un registre partagé.","Comment les blocs forment une chaîne.","Pourquoi il est difficile de tricher.","La différence avec la cryptomonnaie et le Web3."]]],r:"Avant de parler de blockchain, comprenons pourquoi on a besoin de garder une trace."},
{stage:1,t:"Pourquoi garder une trace ?",b:[["svg","tontine"],["p","Imagine une tontine dans laquelle plusieurs personnes cotisent chaque semaine. Chaque fois qu’un membre verse sa cotisation, la personne responsable note son nom, le montant versé et la date dans un carnet."],["p","Mais un jour, un membre affirme avoir déjà payé alors que le responsable ne retrouve aucune trace de son versement."],["p","Qui a raison ? Sans preuve écrite, il devient difficile de vérifier ce qui s’est réellement passé."],["p","C’est pour éviter ce genre de désaccord qu’on utilise des registres : des cahiers ou des documents qui permettent de garder une trace des opérations."]],r:"Un registre sert à conserver les informations importantes pour pouvoir les vérifier plus tard."},
{stage:1,t:"Le problème d’un seul gardien",b:[["svg","gardien"],["p","Reprenons notre tontine. Imaginons qu’une seule personne garde le carnet de cotisations. Tous les membres doivent lui faire confiance pour noter correctement les versements et conserver les informations."],["p","C’est pratique, mais tout repose sur cette personne. Elle peut se tromper, perdre le carnet ou même être accusée d’avoir modifié certaines informations."],["p","Ce fonctionnement existe aussi ailleurs. Une banque conserve les opérations de ses clients. Une administration garde les informations relatives aux documents officiels. Dans chaque cas, les utilisateurs dépendent d’un organisme chargé de gérer et de protéger les informations."]],r:"Lorsqu’un seul acteur contrôle le registre, il faut lui faire confiance pour bien faire son travail."},
{stage:2,t:"Et si tout le monde avait une copie ?",b:[["svg","copies"],["p","Et si, au lieu d’un seul carnet, chaque membre de la tontine gardait une copie ? Chaque fois qu’une cotisation est versée, tout le monde met à jour sa copie."],["p","Si quelqu’un tentait de changer ses chiffres en cachette, les autres copies le contrediraient."],["p","C’est le principe d’une blockchain : un registre numérique partagé, dont des copies sont conservées par de nombreux participants, qui suivent des règles communes."],["kw","Nœud","un ordinateur qui conserve une copie du registre et participe au réseau."]],r:"Une blockchain est un registre partagé entre de nombreux participants."},
{stage:3,t:"Pourquoi parle-t-on de « chaîne de blocs » ?",b:[["svg","chaine"],["p","Revenons à notre carnet de tontine. Imagine maintenant que les cotisations soient enregistrées par groupes, dans des blocs numériques."],["p","Chaque bloc contient les informations d’un groupe d’opérations. Mais il contient aussi une empreinte numérique du bloc qui le précède. Cette empreinte est un peu comme une référence calculée à partir des informations du bloc précédent."],["p","Si les informations du premier bloc changent, son empreinte change également. Le bloc suivant possède alors une référence qui ne correspond plus. Les blocs sont donc reliés les uns aux autres, comme les maillons d’une chaîne."],["p","C’est de là que vient le mot blockchain : block signifie « bloc » et chain signifie « chaîne »."],["kw","Empreinte numérique (hash)","un code calculé à partir des informations d’un bloc."]],r:"Chaque bloc est relié au précédent grâce à son empreinte numérique."},
{stage:3,t:"Pourquoi est-il difficile de tricher ?",b:[["svg","triche"],["p","Reprenons notre carnet de tontine. Imagine qu’une personne modifie une ancienne page du carnet."],["p","Son empreinte numérique change. Le bloc suivant ne correspond alors plus à l’empreinte attendue. Le lien est rompu, et la modification peut être détectée."],["p","Pour tenter de faire accepter cette nouvelle version, il faudrait aussi reconstruire les blocs suivants et respecter les règles de validation du réseau. Sur une blockchain bien sécurisée et largement distribuée, cela peut demander des ressources considérables."],["p","Mais attention : une blockchain ne garantit pas que toutes les informations enregistrées sont vraies. Si quelqu’un enregistre une fausse information dès le départ, la blockchain ne peut pas automatiquement savoir qu’elle est fausse."]],r:"La blockchain aide à protéger l’historique des modifications, mais elle ne garantit pas la vérité des informations enregistrées."},
{stage:3,t:"Blockchain et cryptomonnaie : est-ce la même chose ?",b:[["svg","arbre"],["p","Beaucoup de personnes pensent que blockchain et cryptomonnaie désignent la même chose. Cette confusion vient notamment du Bitcoin, dont le réseau a commencé à fonctionner en janvier 2009."],["p","Mais le Bitcoin n’est pas la blockchain elle-même : c’est une monnaie numérique qui fonctionne grâce à une blockchain."],["p","La blockchain peut aussi servir à enregistrer d’autres types d’informations : des transferts de jetons, des certificats numériques, certaines étapes du parcours d’un produit, ou encore les règles de fonctionnement de certaines organisations appelées DAO."],["kw","Cryptomonnaie","une monnaie numérique qui fonctionne grâce à une blockchain, comme le Bitcoin."],["kw","DAO","une organisation dont les règles de fonctionnement sont enregistrées sur une blockchain. On la découvrira dans un prochain module."],["q","Pense à Internet et à l’e-mail. Internet est une technologie qui permet de nombreux usages. L’e-mail n’est qu’un de ces usages. C’est pareil ici : la cryptomonnaie est l’un des usages possibles de la blockchain."]],r:"La blockchain est une technologie de registre. Une cryptomonnaie est l’une des applications qui peuvent l’utiliser."},
{stage:3,t:"Blockchain et Web3 : quel est le lien ?",b:[["svg","cercles"],["p","Dans le module précédent, nous avons découvert le Web3 : une vision d’Internet dans laquelle les utilisateurs peuvent avoir davantage de contrôle sur certains éléments numériques. La blockchain fait partie des technologies qui peuvent aider à construire cette vision."],["p","Mais il faut comprendre une chose : tout ce qui est numérique n’a pas besoin d’une blockchain. Par exemple, pour enregistrer les commandes d’un petit commerce, une base de données classique peut être plus simple, plus rapide et moins coûteuse."],["p","La blockchain devient intéressante lorsqu’il est utile de partager un registre entre plusieurs participants qui ne veulent pas dépendre entièrement d’un seul gestionnaire."],["p","Elle a aussi ses limites : selon le réseau, les opérations peuvent être lentes, coûteuses ou complexes à utiliser."]],r:"La blockchain est un outil, pas une solution à tous les problèmes. Il faut d’abord comprendre le besoin auquel elle répond."},
{stage:3,t:"Récapitulons !",b:[["svg","fil"],["p","Retenons les trois idées essentielles :"],["ul",["Un registre : il garde une trace des opérations.","Partagé : plusieurs participants disposent de copies et suivent des règles communes.","En chaîne : les informations sont regroupées en blocs reliés cryptographiquement."]],["p","Et surtout :"],["ul",["La blockchain est une technologie.","Le Bitcoin est une cryptomonnaie qui utilise une blockchain.","Le Web3 est une vision d’Internet qui peut s’appuyer sur la blockchain."]],["p","Tu connais maintenant le principe de la blockchain. Mais comment envoyer de la valeur sur ce réseau ? C’est ce que nous allons découvrir dans le prochain module : le wallet et la transaction."]],r:"Un registre, partagé, en chaîne."}
];
var quiz=[

{q:"Comment les blocs sont-ils reliés les uns aux autres ?",o:["Grâce au mot de passe de chaque utilisateur","Grâce à une photo enregistrée dans chaque bloc","Grâce à une empreinte numérique du bloc précédent","Grâce au prix du Bitcoin"],c:2,e:"Chaque bloc contient une référence cryptographique au bloc précédent. C’est ce qui permet de former une chaîne."},
{q:"Pourquoi est-il difficile de modifier un ancien bloc ?",o:["Parce que les informations sont secrètes","Parce qu’il faudrait aussi reconstruire les blocs suivants et faire accepter la modification selon les règles du réseau","Parce que la loi interdit de modifier les blocs","Parce que les blocs sont imprimés sur du papier"],c:1,e:"Modifier un ancien bloc change son empreinte et perturbe les liens avec les blocs suivants. Le réseau doit aussi accepter la nouvelle version selon ses règles de validation."},
{q:"Quelle affirmation est correcte ?",o:["Blockchain et Bitcoin sont exactement la même chose","La blockchain sert uniquement à envoyer de l’argent","La blockchain remplace toujours les bases de données classiques","Le Bitcoin est une cryptomonnaie qui utilise une blockchain"],c:3,e:"Le Bitcoin est une cryptomonnaie. La blockchain est la technologie de registre sur laquelle son réseau s’appuie."}
];
var step=0,qi=0,score=0,app=document.getElementById("app");
function rail(s){var l=["Un registre","Partagé","En chaîne"];return '<div class="rail">'+l.map(function(x,i){return '<span class="'+(s>i?'on':'')+'">'+x+'</span>'}).join("")+'</div>'}

function blk(x){var k=x[0];
 if(k=="svg")return '<div class="ill">'+SVG[x[1]]+'</div>';
 if(k=="p")return '<p>'+x[1]+'</p>';
 if(k=="q")return '<p class="analogie"><b>Analogie.</b> '+x[1]+'</p>';
 if(k=="ol")return '<ol>'+x[1].map(function(i){return '<li>'+i+'</li>'}).join("")+'</ol>';
 if(k=="ul")return '<ul>'+x[1].map(function(i){return '<li>'+i+'</li>'}).join("")+'</ul>';
 if(k=="kw")return '<p class="kw"><b>Mot clé : '+x[1]+'.</b> C’est '+x[2]+'</p>';
 return ''}
function lesson(){
 var s=screens[step],h='<p class="brand"><a class="home" href="index.html#education" aria-label="Retour à l’accueil">←</a> Blockchain RD Congo · Module 2</p>'+rail(s.stage)+'<p class="count">'+(step+1)+' sur '+screens.length+'</p>';
 h+='<h2>'+s.t+'</h2>';
 s.b.forEach(function(x){h+=blk(x)});
 h+='<div class="retenir"><small>À retenir</small>'+s.r+'</div>';
 h+='<div class="nav">'+(step>0?'<button onclick="go(-1)">Retour</button>':'<a class="btn" href="index.html">Accueil</a>')+'<button class="main" onclick="go(1)">'+(step==screens.length-1?'Commencer le quiz':'Suivant')+'</button></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function go(d){if(step+d>=screens.length){qi=0;score=0;ask();return}step+=d;lesson()}
function ask(){
 var q=quiz[qi],h='<p class="brand"><a class="home" href="index.html#education" aria-label="Retour à l’accueil">←</a> Blockchain RD Congo · Quiz du module 2</p><p class="count">Question '+(qi+1)+' sur '+quiz.length+'</p><h2>'+q.q+'</h2>';
 q.o.forEach(function(o,i){h+='<button class="opt" onclick="pick('+i+')"><b>'+"ABCD".charAt(i)+'.</b> '+o+'</button>'});
 h+='<div id="fb"></div>';app.innerHTML=h;window.scrollTo(0,0)}
function pick(i){
 var q=quiz[qi];
 document.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true;if(j==q.c)x.classList.add("good");else if(j==i)x.classList.add("wrong")});
 if(i==q.c)score++;
 document.getElementById("fb").innerHTML='<p class="expl"><b>'+(i==q.c?'Bonne réponse.':'Pas tout à fait.')+'</b> '+q.e+'</p><div class="nav"><button class="main" onclick="nextQ()">'+(qi==quiz.length-1?'Voir mon résultat':'Question suivante')+'</button></div>'}
function nextQ(){qi++;if(qi>=quiz.length){end();return}ask()}
function end(){try{var P=JSON.parse(localStorage.getItem("brdc_v1_progress")||"{}");P["m2"]={done:true,score:score,total:quiz.length};localStorage.setItem("brdc_v1_progress",JSON.stringify(P))}catch(e){}
 var n=quiz.length,m=score==n?"Excellent ! Tu as compris les idées essentielles de la blockchain.":score>=n-1?"Bien joué ! Tu es sur la bonne voie. Tu peux revoir les notions qui te semblent encore floues.":"Pas de souci ! Reprends tranquillement le module. L’objectif est de comprendre, pas d’aller vite.";
 app.innerHTML='<p class="brand"><a class="home" href="index.html#education" aria-label="Retour à l’accueil">←</a> Blockchain RD Congo · Module 2</p><h2>Ton résultat</h2><p class="score">'+score+' sur '+n+'</p><p>'+m+'</p><div class="nav"><a class="btn" href="index.html">Accueil</a><button class="main" onclick="qi=0;score=0;ask()">Refaire le quiz</button></div><p><button class="lnk" onclick="step=0;lesson()">Revoir la leçon</button></p>'}
lesson();
</script>
