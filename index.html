.pg{font-size:15px;color:var(--soft);margin:0 0 20px}

.card b{display:block;font-size:19px}
.card span{display:block;font-size:15px;color:var(--soft);margin-top:2px}
.card.lock{opacity:.6}.card.done{border-color:var(--ok)}
.card .st{text-align:center}
.st{display:inline-block;margin-top:8px;font-weight:800;font-size:16px;padding:8px 20px;border-radius:99px;background:#F5D13D;color:#122F5A}
.card.done .st{background:transparent;border:1.5px solid var(--ok);color:var(--ok)}
.card.lock .st{background:transparent;border:1.5px solid var(--line);color:var(--soft);font-weight:600;font-size:15px;padding:4px 12px}
.note{font-size:14px;color:var(--soft);margin-top:22px}
button.r{font:inherit;font-size:14px;background:none;border:none;color:var(--soft);text-decoration:underline;padding:6px 0;cursor:pointer}
.soon{text-align:center;padding:30px 10px}.soon .ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs{display:flex;gap:4px;width:100%;max-width:480px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:none;background:none;border-radius:20px;font:inherit;font-size:12px;font-weight:600;color:var(--soft);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:#F5D13D;color:#122F5A;font-weight:800}
#intro{position:fixed;inset:0;z-index:50;background:#0C2040;color:#fff;display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow:hidden}
#intro.show{display:flex}
#intro:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.4px),radial-gradient(#fff 1px,transparent 1.4px);background-size:90px 90px,140px 140px;background-position:10px 20px,60px 70px;opacity:.14}
.segs{display:flex;gap:6px;position:relative}.segs div{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.segs i{display:block;height:100%;width:0;background:#fff}

@keyframes fillb{to{width:100%}}
.skip{align-self:flex-end;background:none;border:none;color:#b6c3da;font:inherit;font-size:15px;padding:12px 0;cursor:pointer;position:relative}

.cta{position:relative;font:inherit;font-weight:800;font-size:18px;border:none;border-radius:16px;padding:16px;background:#F5D13D;color:#122F5A;cursor:pointer}
.starg{transform-origin:100px 100px;animation:grow 5s ease-in-out infinite}
@keyframes grow{0%{transform:scale(.15) rotate(-25deg);opacity:0}28%{transform:scale(1.08) rotate(0);opacity:1}38%{transform:scale(.97)}48%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.halo{transform-origin:100px 100px;animation:halo 5s ease-in-out infinite}
@keyframes halo{0%,20%{opacity:0;transform:scale(.4)}45%{opacity:.16;transform:scale(1)}88%{opacity:.1;transform:scale(1.12)}100%{opacity:0}}
.sp{animation:tw 2.5s ease-in-out infinite}.sp2{animation:tw 2.5s 1.1s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.stem{stroke-dasharray:110;stroke-dashoffset:110;animation:stem 5s ease-out infinite}
@keyframes stem{0%{stroke-dashoffset:110;opacity:1}32%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.lf{transform:scale(0);animation:leaf 5s ease-out infinite;transform-origin:100px 92px}
.lf2{animation-delay:.25s;transform-origin:100px 100px}
@keyframes leaf{0%,28%{transform:scale(0);opacity:1}52%{transform:scale(1.08)}60%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.starg,.halo,.sp,.sp2,.lf,.stem{animation:none}.lf{transform:none}.stem{stroke-dashoffset:0}.halo{opacity:.12}.segs .run i{animation:none;width:100%}}
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:none}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;margin-top:2px}.chk.ok{background:#F5D13D;border-color:#F5D13D;color:#122F5A}
.tt b{display:block;font-size:17px;line-height:1.25}.tt small{display:block;color:var(--soft);font-size:14px}.ta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.mini{font:inherit;font-size:14px;font-weight:600;border-radius:99px;padding:7px 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mini.pri{background:#F5D13D;border-color:#F5D13D;color:#122F5A;font-weight:800}.mini:disabled{opacity:.5;cursor:default}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}.box h2{margin-top:0}.box.ok{border-color:var(--ok)}
.small{font-size:15px;color:var(--soft)}.opt{font-size:12px;font-weight:600;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 8px;vertical-align:middle}
.soc{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.soc:first-of-type{border-top:none}
.cta2{display:block;text-align:center;text-decoration:none;font-weight:800;border-radius:14px;padding:13px;background:#F5D13D;color:#122F5A}
.notice{border-left:5px solid #F5D13D;background:var(--card);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:16px}.lk{color:var(--blue);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bd{text-align:center;font-size:13px;line-height:1.2}
.bd i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:#F5D13D;font-style:normal;font-size:26px}.bd.off{opacity:.45}.bd.off i{background:var(--line);filter:grayscale(1)}
.av{width:72px;height:72px;border-radius:50%;background:#1F4590;color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;margin:0 auto 8px}
.rank{display:inline-block;background:#F5D13D;color:#122F5A;font-weight:800;border-radius:99px;padding:4px 14px;font-size:15px;margin-top:4px}
.tab{font-size:11px;padding:8px 0}
</style>
